services:
  api:
    build: .
    # The per-address limits trust X-Forwarded-For from a private peer (see "Behind a proxy" in
    # README.md). If this port is reachable directly, not only through your proxy, publish it on
    # localhost instead ("127.0.0.1:${PORT:-3000}:3000") or set TRUST_PROXY=false in .env.
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOADS_DIR: /app/uploads
      DATA_DIR: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
